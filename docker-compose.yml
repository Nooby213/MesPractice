services:
  mysql:
    image: mysql:8.4
    container_name: mes-practice-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: mes_practice
      MYSQL_USER: mes_user
      MYSQL_PASSWORD: mes_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data:
