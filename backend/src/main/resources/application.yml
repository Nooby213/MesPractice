spring:
  application:
    name: mes-practice
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mes_practice?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:mes_user}
    password: ${DB_PASSWORD:mes_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
